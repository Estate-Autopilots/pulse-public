[project]
name = "pulse-meta-ads"
version = "0.1.0"
description = "Read-only Meta Marketing API daily campaign metrics collector"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pulse-sdk"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv.sources]
pulse-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse_meta_ads"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pulse_sdk", "pulse_meta_ads"]
