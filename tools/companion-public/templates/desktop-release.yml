name: Desktop updater release
on:
  push:
    branches: [main]
    paths: ['apps/desktop/**', '.github/workflows/desktop-release.yml']
  workflow_dispatch:
permissions: { contents: read, actions: read }
concurrency: { group: companion-release, cancel-in-progress: false }
jobs:
  desktop:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[desktop-only]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows, bundles: 'nsis,msi', target: '' }
          - { os: macos-latest, platform: macos, bundles: 'app,dmg', target: universal-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env: { CARGO_BUILD_JOBS: '2', RAYON_NUM_THREADS: '2' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/core
            apps/desktop/src-tauri
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop exec playwright install chromium
      - run: node --test --test-concurrency=2 packages/companion/test/*.test.js
      - run: pnpm --dir apps/desktop build && pnpm --dir apps/desktop test
        env: { PULSE_UPDATE_SCREENSHOT_DIR: update-screens }
      - run: cargo test -j2 --manifest-path apps/desktop/core/Cargo.toml -- --test-threads=2
      - name: Load the stable Mac signing identity
        if: matrix.platform == 'macos'
        shell: bash
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then echo "Stable Mac signing identity is required"; exit 1; fi
          kc="$RUNNER_TEMP/pulse-signing.keychain-db"; kcpw=$(openssl rand -hex 16)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/pulse.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -t 3600 -u "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/pulse.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "Pulse Code Signing" -p "$kc" > "$RUNNER_TEMP/pulse-signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/pulse-signing.pem"
          rm -f "$RUNNER_TEMP/pulse.p12"
          security find-identity -v -p codesigning "$kc" | grep -q '"Pulse Code Signing"'
          echo "APPLE_SIGNING_IDENTITY=Pulse Code Signing" >> "$GITHUB_ENV"
      - name: Build signed updater bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm --dir apps/desktop exec tauri build --bundles '${{ matrix.bundles }}' ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - run: cargo test -j2 --manifest-path apps/desktop/src-tauri/Cargo.toml -- --test-threads=2
      - uses: actions/upload-artifact@v7
        with:
          name: companion-desktop-${{ matrix.platform }}-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.sig
            apps/desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: update-layout-${{ matrix.platform }}
          path: apps/desktop/update-screens/
          if-no-files-found: error
  windows-tray:
    needs: desktop
    uses: ./.github/workflows/windows-tray-acceptance.yml
    with:
      build_run: ${{ format('{0}', github.run_id) }}
      artifact_name: companion-desktop-windows-${{ github.sha }}
  publish:
    needs: [desktop, windows-tray]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - uses: actions/download-artifact@v7
        with: { path: artifacts, pattern: 'companion-desktop-*-${{ github.sha }}' }
      - name: Publish desktop manifest without changing the Android manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/publish-desktop-release.mjs
