name: Verify built Windows tray
on:
  workflow_call:
    inputs:
      build_run: {required: true, type: string}
      artifact_name: {required: true, type: string}
  workflow_dispatch:
    inputs:
      build_run: {description: 'Pulse Companion builds run', required: true, type: string}
      artifact_name: {description: 'Exact Windows artifact', required: true, type: string}
permissions: {contents: read, actions: read}
jobs:
  tray:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          name: ${{ inputs.artifact_name }}
          path: archive
      - name: Install the finished EXE and click its actual tray icon
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          New-Item -ItemType Directory -Force screens | Out-Null
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN" | ConvertFrom-Json
          if (@('Pulse Companion builds', 'Desktop updater release') -notcontains $run.name -or $run.head_branch -ne 'main' -or $env:ARTIFACT_NAME -ne "companion-desktop-windows-$($run.head_sha)") { throw 'Wrong build artifact' }
          $exe = Get-ChildItem archive -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Installer missing' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $install = Start-Process $exe.FullName -ArgumentList '/S','/D=C:\PulseAcceptance' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installer failed' }
          $binary = 'C:\PulseAcceptance\pulse-desktop.exe'
          if (-not (Test-Path $binary)) { throw 'Installed executable missing' }
          $env:PULSE_ACCEPTANCE_DIR = (Resolve-Path screens).Path
          $env:PULSE_ACCEPTANCE_ADDRESS = 'https://pulse.estateautopilots.com'
          Start-Process $binary -ArgumentList '--admission-acceptance' -Wait
          $admission = (Get-Content screens/admission.json -Raw | ConvertFrom-Json).result.Ok
          if (-not $admission.readDenied -or -not $admission.refreshDenied -or -not $admission.signedOutOnly) { throw 'Installed native HTTPS admission failed' }
          $app = Start-Process $binary -ArgumentList '--pinned' -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh(); $panel = $app.MainWindowHandle
          if ($app.HasExited -or $panel -eq 0) { throw 'Installed panel failed to start' }
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes,System.Windows.Forms,System.Drawing
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class PulseTray { [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out Rect r); public struct Rect { public int Left, Top, Right, Bottom; } [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y); [DllImport("user32.dll")] public static extern void mouse_event(uint flags,uint dx,uint dy,uint data,UIntPtr extra); }'
          function Click-Element($element) {
            $r = $element.Current.BoundingRectangle
            if ($r.IsEmpty) { throw 'Tray button has no screen position' }
            [PulseTray]::SetCursorPos([int]($r.X+$r.Width/2),[int]($r.Y+$r.Height/2)) | Out-Null
            [PulseTray]::mouse_event(2,0,0,0,[UIntPtr]::Zero)
            [PulseTray]::mouse_event(4,0,0,0,[UIntPtr]::Zero)
            Start-Sleep -Seconds 2
          }
          function Capture($name) {
            $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height
            $g=[System.Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size)
            $bmp.Save("screens/$name.png",[System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose();$bmp.Dispose()
          }
          [System.Windows.Forms.SendKeys]::SendWait('^%p');Start-Sleep -Seconds 2
          if ([PulseTray]::IsWindowVisible($panel)) { throw 'Shortcut did not hide installed panel' }
          $root=[System.Windows.Automation.AutomationElement]::RootElement
          $condition=[System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::Button)
          $buttons=$root.FindAll([System.Windows.Automation.TreeScope]::Descendants,$condition)
          $hidden=$buttons | Where-Object {$_.Current.Name -match 'hidden icons|Hidden icon menu'} | Select-Object -First 1
          if ($hidden) { Click-Element $hidden }
          $buttons=$root.FindAll([System.Windows.Automation.TreeScope]::Descendants,$condition)
          $buttons | ForEach-Object {$_.Current.Name} | Set-Content screens/tray-button-names.txt
          $icon=$buttons | Where-Object {$_.Current.Name -match '^Pulse(?:\s|$)'  -and $_.Current.ProcessId -ne $app.Id} | Select-Object -First 1
          if (-not $icon) { Capture 'windows-tray-missing';throw 'Pulse tray button missing from the visible tray/overflow' }
          Capture 'windows-tray-icon'
          Click-Element $icon
          if (-not [PulseTray]::IsWindowVisible($panel)) { throw 'Actual tray click did not open the installed panel' }
          Capture 'windows-tray-panel-click'
          $rect = New-Object PulseTray+Rect
          [PulseTray]::GetWindowRect($panel,[ref]$rect) | Out-Null
          $area = [System.Windows.Forms.Screen]::FromHandle($panel).WorkingArea
          if ($rect.Left -lt $area.Left -or $rect.Top -lt $area.Top -or $rect.Right -gt $area.Right -or $rect.Bottom -gt $area.Bottom) { throw 'Panel outside monitor work area' }
          [PulseTray]::SetForegroundWindow($panel) | Out-Null
          Start-Sleep -Seconds 1
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}'); Start-Sleep -Seconds 2
          if ([PulseTray]::IsWindowVisible($panel)) { throw 'Escape did not dismiss installed panel' }
          [System.Windows.Forms.SendKeys]::SendWait('^%p'); Start-Sleep -Seconds 2
          if (-not [PulseTray]::IsWindowVisible($panel)) { throw 'Keyboard did not reopen installed panel' }
          $browsers = @(Get-Process chrome,msedge,firefox -ErrorAction SilentlyContinue).Count
          if ($browsers -ne 0) { throw 'Browser-closed probe had a browser running' }
          @{buildRun=$env:BUILD_RUN;buildCommit=$run.head_sha;artifactName=$env:ARTIFACT_NAME;installerSha256=$hash;installed=$true;shortcutHide=$true;trayIconFound=$true;trayClickOpened=$true;escapeDismissed=$true;keyboardReopened=$true;placementInsideWorkArea=$true;browserProcesses=$browsers} | ConvertTo-Json | Set-Content screens/acceptance.json
          Stop-Process -Id $app.Id -Force
      - name: A real Windows toast from the installed app, through its registered identity
        continue-on-error: true
        shell: powershell
        run: |
          $proof = Join-Path $env:RUNNER_TEMP 'ping-proof'; New-Item -ItemType Directory -Force $proof | Out-Null
          $env:PULSE_ACCEPTANCE_DIR = $proof
          $ping = Start-Process 'C:\PulseAcceptance\pulse-desktop.exe' -ArgumentList '--ping-acceptance' -PassThru
          Start-Sleep -Seconds 4
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds;$bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height
          $g=[System.Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size);$bmp.Save("screens/windows-installed-toast.png",[System.Drawing.Imaging.ImageFormat]::Png)
          $ping.WaitForExit(30000) | Out-Null
          [Windows.UI.Notifications.ToastNotificationManager, Windows.UI.Notifications, ContentType = WindowsRuntime] | Out-Null
          $history = @([Windows.UI.Notifications.ToastNotificationManager]::History.GetHistory('com.pulse.work')).Count
          $setting = "$([Windows.UI.Notifications.ToastNotificationManager]::CreateToastNotifier('com.pulse.work').Setting)"
          $receipt = Get-Content (Join-Path $proof 'ping.json') -Raw | ConvertFrom-Json
          @{installed=$true; shown=$receipt.shown; error=$receipt.error; permission=$receipt.permission; historyCount=$history; setting=$setting} | ConvertTo-Json | Set-Content screens/windows-installed-toast.json
          if ($history -lt 1 -or $setting -ne 'Enabled') { throw "Toast not delivered: history $history, setting $setting" }
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: 'windows-tray-diagnostics-${{ github.run_id }}', path: screens/, if-no-files-found: error}
