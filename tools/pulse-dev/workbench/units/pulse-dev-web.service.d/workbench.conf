# The owner watches this server: it wins CPU over agents, CI and batch work (weights are relative, default 100).
# Turbopack has aborted on an internal panic (7 Oct 2026 01:30Z) and the parent process then exited cleanly, which
# Restart=on-failure does not cover: always come back, the heal check is only the backstop.
[Unit]
Wants=pulse-dev-warm.service
[Service]
CPUWeight=1000
Restart=always
RestartSec=5
