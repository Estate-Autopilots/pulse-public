[project]
name = "pulse-rules"
version = "0.1.0"
description = "Deterministic delivery-detection rules for Pulse"
requires-python = ">=3.11"
dependencies = [
    "pulse-sdk",
    "jsonschema>=4.23",
]

[tool.uv.sources]
pulse-sdk = { workspace = true }
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulse_rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
