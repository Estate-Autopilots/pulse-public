[project]
name = "pulse-ingest"
version = "0.1.0"
description = "Pulse ingest: POST /v1/events (signed device batches) and /healthz"
requires-python = ">=3.12"
dependencies = [
    "pulse-sdk",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg-pool>=3.2",
]

[project.scripts]
pulse-ingest = "pulse_ingest.app:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[tool.uv.sources]
pulse-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pulse_sdk", "pulse_ingest", "pulse_workers"]
