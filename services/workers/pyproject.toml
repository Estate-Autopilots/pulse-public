[project]
name = "pulse-workers"
version = "0.1.0"
description = "Pulse workers: projectors (work graph, attribution), partition maintenance, retention, scheduler"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.2",
    "openpyxl>=3.1.5",
    "pulse-rules",
    "pulse-sdk",
    "pypdf>=6.0",
    "xlrd>=2.0.2",
]

[project.scripts]
pulse-worker = "pulse_workers.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv.sources]
pulse-sdk = { workspace = true }
pulse-rules = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse_workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pulse_sdk", "pulse_ingest", "pulse_workers"]
