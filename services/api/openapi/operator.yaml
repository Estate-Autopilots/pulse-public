openapi: 3.1.0
info: { title: Pulse operator API, version: 1.0.0 }
description: >-
  First run and break-glass setup for the person who runs a Pulse install (ADR-0031 §2), called from the server itself
  by `pulse-admin` on http://127.0.0.1:8081. The routes exist only when PULSE_OPERATOR_TOKEN is set (otherwise 404),
  the web proxies never forward them (404), and every call is written to the audit log as actor `operator`.
security: [{ operatorToken: [] }]
paths:
  /api/v1/operator/agent-chat:
    post:
      summary: Set up a post-only AI member and custom group in the install company
      description: Idempotent by username and original chat name. First staff member owns/admins the group. Members resolve through individual active Workspace accounts. Audited as operator; creates no staff credentials, roles or HR rows. No query parameters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, username, chat, members]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                username: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{2,39}$' }
                chat: { type: string, minLength: 2, maxLength: 60 }
                members: { type: array, minItems: 1, maxItems: 256, uniqueItems: true, items: { type: string, minLength: 3, maxLength: 120, pattern: '^[^\s@]+@[^\s@]+$' } }
      responses:
        '200':
          description: Existing or newly created identity and group; UUIDs only
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [agentId, chatId]
                properties: { agentId: { type: string, format: uuid }, chatId: { type: string, format: uuid } }
        '400': { description: Invalid input or unresolved/inactive/shared member account }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Install not initialised, operator API off or call relayed by web tier }
        '409': { description: Username belongs to a human, callable or disabled AI member }
  /api/v1/operator/status:
    get:
      summary: Whether the install is initialised, and its company
      responses:
        '200':
          description: Install state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: PULSE_OPERATOR_TOKEN is not set, or the call came through the web tier }
  /api/v1/operator/init:
    post:
      summary: Create the company, the install marker and the first admin (once)
      description: >-
        One transaction (pulse.install_init). Every field is required and nothing has a default. The admin gets the
        `admin` role and a temporary password that must be changed at first sign-in; it is returned once and never
        logged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorInit' }
      responses:
        '201':
          description: The install is initialised
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorInitResult' }
        '400': { description: A field is missing, unknown or invalid (time zone not an IANA name, code not 2 to 4 capitals) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: PULSE_OPERATOR_TOKEN is not set, or the call came through the web tier }
        '409': { description: The install is already initialised }
  /api/v1/operator/org:
    post:
      summary: Rename the install's company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties: { name: { type: string, minLength: 2, maxLength: 80 } }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { type: object, additionalProperties: false, required: [ok], properties: { ok: { const: true } } }
        '400': { description: The name is missing or not 2 to 80 characters }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not initialised, PULSE_OPERATOR_TOKEN is not set, or the call came through the web tier }
  /api/v1/operator/roles:
    get:
      summary: Who holds admin, hr, leadership and privacy today
      description: Roles come only from the database (pulse.role_assignment, ADR-0031 §3). Ordered by role, then name.
      responses:
        '200':
          description: Current holders
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [roles]
                properties:
                  roles: { type: array, items: { $ref: '#/components/schemas/OperatorRoleHolder' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not initialised, PULSE_OPERATOR_TOKEN is not set, or the call came through the web tier }
    post:
      summary: Grant or revoke a role for the staff member with this email (break-glass)
      description: >-
        One transaction (pulse.operator_role_set): the same role_assignment row and record_change line as Settings →
        Roles, audited as `operator_role_grant` or `operator_role_revoke` by actor `operator`. The email matches the
        person's work email or one of their own Google accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorRoleChange' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, personId, name]
                properties:
                  ok: { const: true }
                  personId: { type: string, format: uuid }
                  name: { type: string }
        '400': { description: A field is missing, unknown or invalid, or the person to grant is not active }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No staff member has this email, not initialised, or the operator API is off }
        '409': { description: Already held, not held, more than one person has the email, or this is the last admin }
components:
  securitySchemes:
    operatorToken: { type: http, scheme: bearer, description: The value of PULSE_OPERATOR_TOKEN (at least 32 characters) }
  responses:
    Unauthorized: { description: The bearer token is missing or wrong }
  schemas:
    OperatorInit:
      type: object
      additionalProperties: false
      required: [name, slug, code, timeZone, adminEmail, adminName]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,39}$' }
        code: { type: string, pattern: '^[A-Z]{2,4}$' }
        timeZone: { type: string, maxLength: 64, description: IANA time zone name, e.g. Europe/London }
        adminEmail: { type: string, maxLength: 120 }
        adminName: { type: string, minLength: 2, maxLength: 120 }
    OperatorInitResult:
      type: object
      additionalProperties: false
      required: [orgId, personId, username, temporaryPassword]
      properties:
        orgId: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        username: { type: string, description: The first admin's sign-in name }
        temporaryPassword: { type: string, description: Shown once; must be changed at first sign-in }
    OperatorRoleChange:
      type: object
      additionalProperties: false
      required: [email, role, action]
      properties:
        email: { type: string, minLength: 3, maxLength: 120 }
        role: { type: string, enum: [admin, hr, leadership, privacy] }
        action: { type: string, enum: [grant, revoke] }
    OperatorRoleHolder:
      type: object
      additionalProperties: false
      required: [role, email, name, active, since]
      properties:
        role: { type: string, enum: [admin, hr, leadership, privacy] }
        email: { type: ['string', 'null'], description: Work email, else the first linked account }
        name: { type: string }
        active: { type: boolean, description: false when the person is no longer active (the role then does nothing) }
        since: { type: string, format: date }
    OperatorStatus:
      type: object
      additionalProperties: false
      required: [initialised, org, version]
      properties:
        initialised: { type: boolean }
        org:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [name, slug, code, time_zone]
              properties:
                name: { type: string }
                slug: { type: string }
                code: { type: string }
                time_zone: { type: string }
        version: { type: string, description: PULSE_RELEASE, or "dev" }
