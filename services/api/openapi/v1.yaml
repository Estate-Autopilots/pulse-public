    "/api/v1/service/chats/{chatId}/messages": {
      "post": {
        "operationId": "postServiceChatsChatIdMessages",
        "summary": "Scope chats.post: post as the key's bound AI member in a member chat",
        "description": "No read operation. An identical slot retry returns the original IDs without another file or notification; changed text, image or chat returns 409. Membership and active AI identity are rechecked on every call. Body cap 3 MiB; PNG/JPEG magic must match the declared MIME; decoded image cap 2 MiB (413).",
        "parameters": [
          {
            "name": "chatId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}-(am|pm)$"
