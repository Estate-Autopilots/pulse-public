  "components": {
    "securitySchemes": {
      "bearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "`psvc_<key id>_<secret>`, `pak_<prefix>_<secret>` or a personal token; scopes are the area grants."
      },
      "serviceKey": {
        "type": "http",
        "scheme": "bearer",
        "description": "`psvc_<key UUID>_<43-character base64url secret>`; scopes fixed at issue; bound to the issuing install; digest only at rest; revocable per key"
      }
    },
    "parameters": {
      "cursor": {
        "name": "cursor",
        "in": "query",
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        }
      },
      "limit": {
        "name": "limit",
        "in": "query",
        "schema": {
          "type": "string",
          "pattern": "^(?:[1-9]|[1-9][0-9]|100)$",
          "default": "100"
