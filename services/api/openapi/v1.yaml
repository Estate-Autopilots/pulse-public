    "/api/v1/service/quotes": {
      "post": {
        "operationId": "postServiceQuotes",
        "summary": "Scope quotes.draft.create: create a DRAFT quotation from catalogue items",
        "description": "Always creates a draft quotation (no number, not issued, not sent) for one client or one lead of this install. Every line is an active catalogue item; its name, SAC, unit and GST rate come from the catalogue. `rate` defaults to the catalogue price; if any line's rate differs from the catalogue price the quotation carries `ownerApprovalNeeded: true`, and Pulse refuses to issue it until someone with the leadership role issues it (that is the approval, recorded in the ERP log). Staff edits to the draft recompute the flag. GST figures are Pulse's own (same arithmetic as a staff draft). Created drafts are audited with the key id; the key cannot read, edit, issue, send, convert or delete documents afterwards. 404 when the install has the money module off.",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "description": "A fresh UUID per intended quotation. Replaying the same key with the same body returns the same draft (200); with a different body, 409.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "lines"
                ],
                "oneOf": [
                  {
                    "required": [
                      "clientId"
                    ]
                  },
                  {
                    "required": [
                      "leadId"
                    ]
                  }
                ],
                "properties": {
                  "clientId": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "leadId": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "salespersonId": {
                    "type": "string",
                    "format": "uuid",
                    "description": "Active staff member; default: the client's or lead's salesperson"
                  },
                  "lines": {
                    "type": "array",
                    "minItems": 1,
                    "maxItems": 50,
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": [
                        "itemId",
                        "qty"
                      ],
                      "properties": {
                        "itemId": {
                          "type": "string",
                          "format": "uuid",
                          "description": "An active catalogue entry from /api/v1/catalog/items"
                        },
                        "qty": {
                          "type": "number",
                          "exclusiveMinimum": 0,
                          "maximum": 100000,
                          "multipleOf": 0.001
                        },
                        "rate": {
                          "type": "integer",
                          "minimum": 0,
                          "maximum": 1000000000000,
                          "description": "INR paise per unit before GST; default the catalogue price; any other value sets ownerApprovalNeeded"
                        },
                        "details": {
                          "type": "string",
                          "maxLength": 1000,
                          "description": "Optional line note shown under the item name"
                        }
                      }
                    }
                  },
                  "notes": {
                    "type": "string",
                    "maxLength": 2000
                  },
                  "sourceRef": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 100,
                    "description": "1.1. Caller's source id (e.g. the Sales X-Ray analysis id), shown in the quotation's ERP history; not printed on the quotation"
                  },
                  "validUntil": {
                    "type": "string",
                    "format": "date",
                    "description": "Default: issue date + 30 days"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Idempotent replay of an earlier identical request",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "id",
                    "status",
                    "number",
                    "clientId",
                    "leadId",
                    "salesperson",
                    "ownerApprovalNeeded",
                    "currency",
                    "validUntil",
                    "lines",
                    "taxable",
                    "tax",
                    "total",
                    "link",
                    "sourceRef"
                  ],
                  "properties": {
                    "id": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "status": {
                      "const": "draft"
                    },
                    "number": {
                      "type": "null",
                      "description": "Drafts have no number; Pulse numbers a quotation when staff issue it"
                    },
                    "clientId": {
                      "type": [
                        "string",
                        "null"
                      ],
                      "format": "uuid"
                    },
                    "leadId": {
                      "type": [
                        "string",
