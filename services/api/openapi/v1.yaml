# Pulse API v1: OpenAPI 3.1 written as JSON (which is YAML), generated from services/api/src/v1.ts and compared in CI
# by services/api/test/v1.test.mjs. Regenerate: cd services/api && pnpm build && V1_OPENAPI_WRITE=1 node --test test/v1.test.mjs
{
  "openapi": "3.1.0",
  "info": {
    "title": "Pulse API v1",
    "version": "1.0.0",
    "description": "One bearer key per call and nothing else: `psvc_` (a connected app, acting as the AI member it is bound to), `pak_` (an AI employee) or a personal token. Access is the key's area scopes (`<area>.read|write` for tasks, projects, people, chats, docs, billing, workflows, companies, search, events, finance, hr, contracts, connectors, pr; granted explicitly, none by default; an AI employee's own runtime key, holding none, reaches every area its managers left it, all unless narrowed) ∩ what its principal may see on the screens ∩ the company whose address is called. A cookie, session or Access identity beside the key: 401. Refusals are `application/problem+json` with the request id (also `X-Request-Id`); every response is `Cache-Control: no-store`; unknown path, query or body fields: 400. Lists use items + nextCursor with limit 1..100 and a token/company/filter-bound opaque cursor; adapters seek by ascending immutable id under row security, never offsets. Authenticated tokens have independent process-local 120/min budgets (4096 active windows); failed auth uses its separate service budget. RateLimit-Limit/Remaining/Reset describe the budget (Reset is seconds); 429 includes Retry-After. Writes require a UUID Idempotency-Key; identical input replays the committed status/body for 24 hours, changed input returns 409. The install-local service paths (`/api/v1/service/…`, `/api/v1/catalog/items`) keep their own contract, inlined here from service.yaml: a `psvc_` key holding the `serviceKey` scope each operation names, and `{ \"error\" }` refusals."
  },
