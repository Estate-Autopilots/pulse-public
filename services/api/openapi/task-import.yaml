openapi: 3.1.0
info: { title: Task paste import, version: 0.1.0 }
paths:
  /api/v0/tasks/import:
    post:
      operationId: importTasks
      summary: Preview or atomically create up to 200 tasks in the signed-in staff person's organisation
      description: >-
        Preview writes nothing. Missing fields default to open, self, no project, no due date and normal priority.
        Preview maps explicit status and quick-add priority aliases. Commit requires canonical statuses/priorities,
        rechecks names/ids under tenant RLS and refuses all rows if any unskipped row has problems.
        Numeric dates default day-first; ambiguous dates need dateOrder. Duplicate flags are warnings; clients
        default to skip with an explicit override. Row numbers are zero-based. Body limit is 1 MiB.
        Same org/person/key replays the stored result, even if rows changed. Another person gets 409.
        Advisory locking serializes concurrent submits; failed batches leave no receipt or tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [importKey, preview, rows]
              properties:
                importKey: { type: string, format: uuid }
                preview: { type: boolean }
                dateOrder: { enum: [dmy, mdy] }
                rows: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/Row' } }
      responses:
        '200':
          description: Preview rows or a stored/created batch
          content:
            application/json:
              schema: { oneOf: [{ type: object, required: [rows], properties: { rows: { type: array, items: { $ref: '#/components/schemas/PreviewRow' } } } }, { $ref: '#/components/schemas/Created' }] }
        '400': { description: Invalid batch; error sentence and per-row problems when row validation failed; nothing created }
        '401': { description: Sign in required }
        '403': { description: Staff account or existing assignment/status permission required }
        '409': { description: Import key belongs to another person }
        '413': { description: Body exceeds 1 MiB }
components:
  schemas:
    Row:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        status: { type: string, description: 'Commit: open, in_progress, blocked or done. Preview also accepts todo/to do/new, doing/in progress/wip/started, waiting/on hold, complete/finished.' }
        assignee: { type: string }
        assigneeId: { type: string, format: uuid }
        project: { type: string }
        projectId: { type: string, format: uuid }
        due: { type: string, description: 'ISO date, day month, weekday or numeric day/month[/year]; dateOrder can select month/day' }
        priority: { type: string, description: 'Commit: low, normal, high or urgent. Preview also accepts p1..p4 and quick-add ! aliases.' }
        skip: { type: boolean }
    Person: { type: object, required: [id, name, isAgent], properties: { id: { type: string, format: uuid }, name: { type: string }, isAgent: { type: boolean } } }
    Project: { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } }
    PreviewRow:
      type: object
      required: [row, title, status, assignee, project, dueOn, priority, defaults, problems, candidates, duplicateOf, duplicateInPaste]
      properties:
        row: { type: integer, minimum: 0 }
        title: { type: string }
        status: { enum: [open, in_progress, blocked, done] }
        assignee: { oneOf: [{ $ref: '#/components/schemas/Person' }, { type: 'null' }] }
        project: { oneOf: [{ $ref: '#/components/schemas/Project' }, { type: 'null' }] }
        dueOn: { type: [string, 'null'], format: date }
        priority: { enum: [low, normal, high, urgent] }
        defaults: { type: array, items: { type: string } }
        problems: { type: array, items: { type: object, required: [field, code, message], properties: { field: { type: string }, code: { type: string }, message: { type: string } } } }
        candidates: { type: object, properties: { assignee: { type: array, items: { $ref: '#/components/schemas/Person' } }, project: { type: array, items: { $ref: '#/components/schemas/Project' } } } }
        duplicateOf: { type: [string, 'null'], format: uuid }
        duplicateInPaste: { type: [integer, 'null'], minimum: 0 }
    Created:
      type: object
      required: [created, skipped, replay]
      properties:
        created: { type: array, items: { type: object, required: [row, id, asked], properties: { row: { type: integer }, id: { type: string, format: uuid }, asked: { type: [object, 'null'], properties: { id: { type: string, format: uuid }, to: { type: [string, 'null'] } } } } } }
        skipped: { type: array, items: { type: integer } }
        replay: { type: boolean }
